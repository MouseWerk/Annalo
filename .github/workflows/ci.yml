name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p aether-core -p aether-cli --all-targets -- -D warnings
      - run: cargo test -p aether-core -p aether-cli
      - run: |
          for f in ui/js/*.js; do node --check "$f"; done

  desktop:
    name: Desktop build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri build
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: aether-os-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
