[package]
name = "aether-cli"
description = "Headless command line for the AETHER OS workspace database"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aether"
path = "src/main.rs"

[dependencies]
aether-core = { path = "../aether-core" }
chrono = "0.4.45"
clap = { version = "4.6", features = ["derive", "env"] }
serde_json = "1.0.151"
